name: Build and deploy to itch.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-deploy
  cancel-in-progress: false

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LISCENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  version:
    name: Read version from DevLog.txt
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          first_line=$(head -n 1 DevLog.txt | tr -d '\r' | sed 's/^\xef\xbb\xbf//')
          if [[ ! "$first_line" =~ ^V[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::First line of DevLog.txt must start with a version like V0.1.1 (found: '$first_line')"
            exit 1
          fi
          echo "version=${BASH_REMATCH[0]}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            targetPlatform: StandaloneWindows64
          - name: Mac
            targetPlatform: StandaloneOSX
          - name: Web
            targetPlatform: WebGL
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # The Unity image is huge; "Failed to write the asset file" errors usually mean the runner ran out of disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-v2-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-v2-${{ matrix.targetPlatform }}-

      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: Off-The-Hook
          versioning: None

      - name: Zip build
        run: |
          zip_name="Off-The-Hook-${{ needs.version.outputs.version }}-${{ matrix.name }}.zip"
          (cd "build/${{ matrix.targetPlatform }}" && sudo zip -r "$GITHUB_WORKSPACE/$zip_name" .)
          echo "ZIP_NAME=$zip_name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

  deploy:
    name: Deploy to itch.io
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: ${{ vars.ITCH_USER }}/${{ vars.ITCH_GAME }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -o butler.zip
          chmod +x butler
          ./butler -V

      # Each version gets its own channel, so itch.io keeps every version as a
      # separate download instead of overwriting the previous one.
      - name: Push Windows and Mac builds
        run: |
          ./butler push "dist/Off-The-Hook-${VERSION}-Windows.zip" "$ITCH_TARGET:windows-${VERSION}" --userversion "$VERSION"
          ./butler push "dist/Off-The-Hook-${VERSION}-Mac.zip" "$ITCH_TARGET:mac-${VERSION}" --userversion "$VERSION"

      # itch.io allows one in-browser playable build, so the web build uses a
      # single channel that always holds the latest version.
      - name: Push Web build
        run: ./butler push "dist/Off-The-Hook-${VERSION}-Web.zip" "$ITCH_TARGET:web" --userversion "$VERSION"

      # itch.io has no API for posting devlogs, so the devlog is published as a
      # GitHub release with the text of DevLog.txt, ready to copy to itch.io.
      - name: Publish devlog as GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$VERSION" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$VERSION" dist/*.zip \
            --title "Off The Hook $VERSION" \
            --notes-file DevLog.txt \
            --target "$GITHUB_SHA"
